<!doctype html>
<html lang=pt-BR>
<head>
<meta charset=UTF-8>

<link rel=stylesheet href=css/style.min.css>
<link rel=stylesheet href=css/base.css>
<link rel=stylesheet href=css/layout.css>
<link rel=stylesheet href=css/components.css>
<link rel=stylesheet href=css/responsivo.css>
</head>
<body>
<header>
<button id=btn-contraste>Alto Contraste</button>
<button id=dark-mode>Modo Escuro</button>
<img src=assets/images/Logo.png alt=Logo width=120>
<nav>
<a href=index.html>Início</a>
<a href=projetos.html>Projetos</a>
<a href=cadastro.html>Cadastro</a>
</nav>
</header>
<main>
<h1>Cadastro</h1>
<form>
<fieldset>
<legend>Dados Pessoais</legend>
<label>Nome Completo:</label>
<input name=nome required minlength=3>
<label>E-mail:</label>
<input type=email name=email required>
<label>CPF:</label>
<input id=cpf required placeholder=000.000.000-00 pattern=\d{3}\.\d{3}\.\d{3}-\d{2}>
<label>Telefone:</label>
<input type=tel id=telefone required placeholder="(00) 00000-0000">
<label>Data de Nascimento:</label>
<input type=date name=nascimento required>
</fieldset>
<fieldset>
<legend>Endereço</legend>
<label>Endereço:</label>
<input required>
<label>CEP:</label>
<input id=cep required placeholder=00000-000 pattern=\d{5}-\d{3}>
<label>Cidade:</label>
<input required>
<label>Estado:</label>
<select required>
<option value="">Selecione</option>
<option value=SP>SP</option>
<option value=RJ>RJ</option>
</select>
</fieldset>
<button type=submit>Enviar</button>
</form>
</main>
<footer>

</footer>

<script src=js/app.js></script>
<script src=js/scripts.min.js></script>
</body>
</html>
